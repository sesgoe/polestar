name: CI

on:
  push:
    branches: [main, next, 'hotfix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1

      # No npm dependencies. A fresh clone has no built data (it needs the game
      # client and local sources), so the tests that read it skip with a reason.
      - name: Test
        run: npm test

      # The interface translations: every locale file loads, no stale key, no
      # broken format; glossary drift only warns. npm test checks the same;
      # this step prints each language's counts and warnings on their own.
      - name: Translations
        run: npm run i18n:check

      # Every changelog fragment in changes/ has a section and an entry, and
      # CHANGELOG.md has no "Unreleased" section of its own.
      - name: Changelog fragments
        run: node tools/polestar.js changelog check

      # The textures are generated from code alone, so CI can rebuild them and
      # fail when the committed ones are stale.
      - name: Textures are up to date
        run: node tools/polestar.js media && git diff --exit-code -- addon/Polestar/Media

      # So are the UI renders: the addon's Lua over sample data and fixtures
      # (frozen guides, not the shipped ones), PNGs from a deflate of their own.
      # A render missing from the commit counts too (intent-to-add puts new
      # files in the diff).
      - name: Previews are up to date
        run: |
          node tools/polestar.js preview
          git add --intent-to-add -- docs/preview
          git diff --exit-code --stat -- docs/preview
